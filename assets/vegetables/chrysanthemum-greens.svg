<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tanOSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C5E1A5"/>
      <stop offset="60%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
    <linearGradient id="tanOLeaf" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <filter id="tanOShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#061E0A" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g filter="url(#tanOShadow)">
    <!-- Tender Stems -->
    <path d="M290,550 Q295,430 280,310 T300,100" fill="none" stroke="url(#tanOSteam)" stroke-width="10" stroke-linecap="round"/>
    <path d="M285,460 Q240,400 200,320" fill="none" stroke="url(#tanOSteam)" stroke-width="7" stroke-linecap="round"/>
    <path d="M300,440 Q350,380 390,300" fill="none" stroke="url(#tanOSteam)" stroke-width="7" stroke-linecap="round"/>

    <!-- Feathery Serrated / Pinnate Lobed Leaves -->
    <!-- Left Branch Leaf -->
    <path d="M200,320 C140,300 110,250 100,190 C130,190 150,220 160,200 C170,180 160,150 190,160 C210,170 200,210 220,220 C230,230 240,260 200,320 Z" fill="url(#tanOLeaf)"/>
    
    <!-- Right Branch Leaf -->
    <path d="M390,300 C450,280 480,230 490,170 C460,170 440,200 430,180 C420,160 430,130 400,140 C380,150 390,190 370,200 C360,210 350,240 390,300 Z" fill="url(#tanOLeaf)"/>

    <!-- Crown Fronds -->
    <path d="M300,240 C240,200 220,130 230,70 C250,70 270,100 280,90 C290,70 280,40 300,40 C320,40 310,70 320,90 C330,100 350,70 370,70 C380,130 360,200 300,240 Z" fill="url(#tanOLeaf)"/>

    <!-- Delicate Vein Skeleton -->
    <path d="M295,240 L298,60" stroke="#DCEDC8" stroke-width="4" stroke-linecap="round"/>
    <path d="M295,170 Q260,140 240,100" stroke="#DCEDC8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M295,170 Q330,140 350,100" stroke="#DCEDC8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dew Drops -->
    <circle cx="285" cy="110" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="180" cy="210" r="5.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="410" cy="190" r="5.5" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>