<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lettuceBase" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="45%" stop-color="#81C784"/>
      <stop offset="85%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <radialGradient id="leafGrad1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="50%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>
    <radialGradient id="leafGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="70%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#07200E" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <g filter="url(#leafShadow)">
    <!-- Outer Wavy Leaves -->
    <path d="M300,520 C180,530 110,440 90,360 C70,270 120,200 180,160 C230,120 370,120 420,160 C480,200 530,270 510,360 C490,440 420,530 300,520 Z" fill="url(#lettuceBase)"/>
    
    <!-- Outer Leaf Ribs and Fringes -->
    <path d="M140,240 Q100,320 150,420 Q220,490 300,500 Q380,490 450,420 Q500,320 460,240 Q410,160 300,160 Q190,160 140,240 Z" fill="url(#leafGrad2)" opacity="0.95"/>
    
    <!-- Mid Rosette Layer -->
    <path d="M190,260 Q160,330 200,400 Q250,450 300,450 Q350,450 400,400 Q440,330 410,260 Q370,200 300,200 Q230,200 190,260 Z" fill="url(#leafGrad1)"/>
    
    <!-- Inner Crispy Heart Leaves -->
    <path d="M240,280 Q220,330 250,380 Q275,410 300,410 Q325,410 350,380 Q380,330 360,280 Q335,240 300,240 Q265,240 240,280 Z" fill="#C8E6C9"/>
    <path d="M270,300 Q260,335 280,365 Q290,380 300,380 Q310,380 320,365 Q340,335 330,300 Q315,270 300,270 Q285,270 270,300 Z" fill="#E8F8EA"/>

    <!-- Delicate Leaf Veins -->
    <path d="M300,480 Q300,360 300,270" stroke="#E8F5E9" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M300,380 Q250,340 200,350" stroke="#E8F5E9" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M300,380 Q350,340 400,350" stroke="#E8F5E9" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M300,430 Q230,410 180,430" stroke="#E8F5E9" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M300,430 Q370,410 420,430" stroke="#E8F5E9" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Glistening Dew Drops -->
    <circle cx="230" cy="310" r="9" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="232" cy="308" rx="4" ry="2" fill="#E1F5FE"/>
    <circle cx="370" cy="360" r="7" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="310" cy="285" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="270" cy="420" r="8" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>