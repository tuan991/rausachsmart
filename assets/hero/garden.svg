<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3C"/>
      <stop offset="40%" stop-color="#417D55"/>
      <stop offset="70%" stop-color="#6DA37A"/>
      <stop offset="100%" stop-color="#C5E3CA"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D2E"/>
      <stop offset="100%" stop-color="#0E331C"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#14441F"/>
    </linearGradient>
    <linearGradient id="bedSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFEE58" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFEE58" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Morning Sun -->
  <circle cx="280" cy="220" r="140" fill="url(#sunGlow)"/>
  <circle cx="280" cy="220" r="50" fill="#FFF9C4" filter="url(#softGlow)"/>

  <!-- Sun Rays streaming down -->
  <polygon points="280,220 0,600 200,800" fill="url(#sunBeam)"/>
  <polygon points="280,220 350,800 650,800" fill="url(#sunBeam)"/>
  <polygon points="280,220 800,700 1100,800" fill="url(#sunBeam)"/>

  <!-- Distant mountain hills -->
  <path d="M0,520 Q300,420 650,490 T1200,460 L1200,800 L0,800 Z" fill="#245836" opacity="0.7"/>
  <path d="M0,560 Q400,480 850,540 T1200,530 L1200,800 L0,800 Z" fill="url(#hill1)"/>

  <!-- Greenhouse and garden canopy line -->
  <path d="M150,520 L400,490 L650,510 L900,485 L1150,515 L1200,800 L0,800 Z" fill="url(#hill2)"/>

  <!-- Vegetable Raised Beds in Perspective -->
  <g opacity="0.95">
    <!-- Bed 1 -->
    <polygon points="120,640 420,610 390,780 40,800" fill="url(#bedSoil)"/>
    <!-- Veggies on Bed 1 -->
    <ellipse cx="140" cy="650" rx="22" ry="14" fill="#66BB6A"/>
    <ellipse cx="190" cy="645" rx="26" ry="16" fill="#81C784"/>
    <ellipse cx="250" cy="640" rx="28" ry="18" fill="#4CAF50"/>
    <ellipse cx="320" cy="635" rx="30" ry="19" fill="#2E7D32"/>
    <ellipse cx="160" cy="710" rx="35" ry="22" fill="#81C784"/>
    <ellipse cx="240" cy="700" rx="38" ry="24" fill="#4CAF50"/>
    <ellipse cx="330" cy="690" rx="42" ry="26" fill="#2E7D32"/>

    <!-- Bed 2 -->
    <polygon points="460,605 760,595 780,780 440,800" fill="url(#bedSoil)"/>
    <!-- Veggies on Bed 2 (Bok choy & amaranth) -->
    <ellipse cx="490" cy="630" rx="24" ry="15" fill="#A5D6A7"/>
    <ellipse cx="550" cy="625" rx="28" ry="17" fill="#81C784"/>
    <ellipse cx="620" cy="620" rx="30" ry="18" fill="#9C27B0" opacity="0.8"/>
    <ellipse cx="690" cy="615" rx="28" ry="17" fill="#BA68C8" opacity="0.8"/>
    <ellipse cx="510" cy="700" rx="36" ry="22" fill="#4CAF50"/>
    <ellipse cx="600" cy="690" rx="40" ry="24" fill="#AB47BC" opacity="0.85"/>
    <ellipse cx="700" cy="680" rx="44" ry="26" fill="#2E7D32"/>

    <!-- Bed 3 -->
    <polygon points="800,600 1100,590 1180,780 830,800" fill="url(#bedSoil)"/>
    <ellipse cx="840" cy="630" rx="26" ry="16" fill="#81C784"/>
    <ellipse cx="910" cy="625" rx="28" ry="18" fill="#4CAF50"/>
    <ellipse cx="990" cy="620" rx="30" ry="19" fill="#66BB6A"/>
    <ellipse cx="880" cy="700" rx="40" ry="25" fill="#66BB6A"/>
    <ellipse cx="980" cy="690" rx="45" ry="28" fill="#388E3C"/>
  </g>

  <!-- Morning Dew Sparkles -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="210" cy="640" r="3"/>
    <circle cx="340" cy="680" r="4"/>
    <circle cx="580" cy="670" r="3.5"/>
    <circle cx="710" cy="660" r="4.5"/>
    <circle cx="920" cy="690" r="3"/>
    <circle cx="1030" cy="710" r="4"/>
  </g>
</svg>